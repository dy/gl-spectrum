<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The gl-spectrum v3 demo of 2016 on the v4 renderer: random palettes, the mirrored spectrum, trail, weighting.">
<title>gl-spectrum v3 demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap">
<style>
  /* The v3 page: app-audio top left, fps-indicator top right, settings-panel in its typer theme bottom left, plot-grid */
  :root { --font: Montserrat, sans-serif; --bg: #fff; --fg: #000 }
  html, body { margin: 0; height: 100%; overflow: hidden }
  body { background: var(--bg); color: var(--fg); font-family: var(--font) }
  canvas { position: fixed; inset: 0; width: 100%; height: 100% }
  #grid { pointer-events: none }
  button, select, input { font: inherit; color: inherit }

  .app-audio-wrap { position: absolute; left: 0; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: flex-start; max-width: 100vw; font-size: 16px; line-height: 2rem; user-select: none; -webkit-user-select: none }
  .app-audio { position: relative; z-index: 1; padding: .5rem 0 0; min-width: 0 }
  .app-audio summary { list-style: none; display: flex; align-items: center; max-width: calc(100vw - 3rem); position: relative; height: 2rem; padding-left: .5rem; cursor: pointer; white-space: nowrap; outline: none }
  .app-audio summary::-webkit-details-marker { display: none }
  .app-audio summary::before { content: ''; position: absolute; left: .65rem; right: 1rem; bottom: .25rem; border-bottom: .13rem dashed currentColor; opacity: .25 }
  .app-audio summary:hover::before, .app-audio[open] summary::before { opacity: 1 }
  .app-audio summary:focus-visible::before { border-bottom-style: solid; opacity: .95 }
  .app-audio.aa-error summary::before { opacity: 0 }
  .aa-icon { width: 1.4rem; height: 1.4rem; fill: currentColor; flex: none }
  summary .aa-icon { margin-top: .2rem }
  .aa-title { overflow: hidden; text-overflow: ellipsis; max-width: 320px; margin-left: .25rem }
  .aa-dropdown { position: absolute; left: 0; top: 0; z-index: -1; min-width: 100%; margin: 0; padding: 2.5rem 0 .5rem; list-style: none; background: color-mix(in srgb, currentColor 10%, var(--bg)) }
  .aa-dropdown ul { list-style: none; margin: .5rem 0 0; padding: 0 }
  .aa-dropdown ul[data-title]::before { content: attr(data-title); display: block; padding: 0 .5rem; opacity: .5 }
  .aa-item { display: block; width: 100%; padding: 0 .5rem; border: 0; background: none; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 2rem; max-width: 100vw; box-sizing: border-box }
  .aa-item:hover, .aa-item:focus-visible { background: color-mix(in srgb, currentColor 25%, transparent); outline: none }
  .aa-play { margin-top: .5rem; height: 2rem; padding: 0 .25rem; border: 0; background: none; cursor: pointer; display: flex; align-items: center }
  .aa-credit { flex-basis: 100%; padding-left: 2.4rem; font-size: 11px; line-height: 1.2; color: inherit; opacity: .6; text-decoration: none; max-width: calc(100vw - 3rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .aa-credit:hover { opacity: 1 }
  .aa-progress { position: fixed; top: 0; left: 0; height: .2rem; background: var(--fg); z-index: 3 }

  /* settings-panel, typer theme: its tones come from the palette (--t08 is the text, --t9 the panel), set by old.js */
  .settings-panel { position: fixed; left: 1rem; bottom: 2.5rem; z-index: 1; max-width: calc(100vw - 4rem); margin: 0; padding: .5rem 1rem; border-radius: 4px; white-space: nowrap; font-size: 12px; line-height: 1.15; color: var(--t08); text-shadow: var(--ts) }
  .settings-panel h2 { display: inline-block; margin: 0; padding: .5rem 0; font-size: 16px; font-weight: 400; line-height: 1; vertical-align: baseline }
  .settings-panel h2 a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--link) }
  .settings-panel h2 a:hover { border-bottom-color: var(--t0) }
  .field { display: inline-flex; align-items: center; height: 24px; padding: 4.8px; margin-left: 1rem; vertical-align: top; cursor: pointer }
  .field > span:first-child { padding-right: 12px; color: var(--t25) }
  .field:hover > span:first-child { color: var(--t08) }
  .select { position: relative; display: inline-block }
  .select select { appearance: none; -webkit-appearance: none; height: 24px; min-width: 4em; margin-right: -3px; padding: 0 12px 0 6px; border: 0; border-radius: 2px; outline: none; cursor: pointer; line-height: 24px; color: var(--t25); text-shadow: var(--ts);
    background: linear-gradient(hsl(from var(--sel) h s calc(l + 7)), hsl(from var(--sel) h s calc(l - 7))) var(--sel);
    box-shadow: inset 1px 0 rgb(from var(--light) r g b / .04), inset 0 1px rgb(from var(--light) r g b / .15), inset 0 -1px 1px rgb(from var(--light) r g b / .07), 0 1px 2px rgb(from var(--shade) r g b / .35) }
  .select select:hover, .select select:focus-visible { --sel: var(--sel-hi) }
  .select option { background: var(--t9); color: var(--t08) }
  .select::before, .select::after { content: ''; position: absolute; right: 4px; top: 50%; border: 2.4px solid transparent; pointer-events: none; color: var(--t25) }
  .select::before { margin-top: -6.5px; border-bottom: 4.8px solid; border-top: 0 }
  .select::after { margin-top: 1px; border-top: 4.8px solid; border-bottom: 0 }
  .field input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 0 8px 0 0; border-radius: 2px; cursor: pointer; background: var(--box); box-shadow: inset 0 1px 2px rgb(from var(--shade) r g b / .18), 0 1px rgb(from var(--light) r g b / .2) }
  .field input[type=checkbox]:hover { background: var(--box-on) }
  .field input[type=checkbox]:checked { background: var(--check) 0 -3px / 19px no-repeat, var(--box-on) }
  .field input:focus-visible, .swatch:focus-visible, .settings-panel a:focus-visible { outline: 1px solid var(--t08); outline-offset: 2px }
  .swatch { display: inline-flex; flex-wrap: wrap; align-content: flex-start; width: 18px; height: 18px; padding: 0; border: 0; cursor: pointer; background: rgb(120 120 120 / .2) }
  .swatch span { width: 50%; height: 50% }

  @media (max-width: 640px) {
    .aa-title { max-width: calc(100vw - 12rem) } /* the play button and fps beside it */
    .settings-panel { white-space: normal; right: 1rem; max-width: none; padding: .25rem .5rem .5rem }
    .settings-panel h2 { display: block; padding: .5rem 0 .25rem 4.8px }
    .field { margin-left: 0; margin-right: .5rem }
  }
</style>
<body>
<canvas id="spectrum" aria-label="Spectrum, mirrored about the middle, low frequencies on the left"></canvas>
<canvas id="grid" aria-hidden="true"></canvas>
<div class="aa-progress" id="progress"></div>
<div class="app-audio-wrap">
  <details class="app-audio" id="source">
    <summary aria-label="Select source"><svg class="aa-icon" viewBox="0 0 819 1024" aria-hidden="true"><path d="M507.094 814.755c13.33 0 26.618-5.179 36.834-15.395l136.231-136.030c13.976-14.827 24.43-44.527 0-73.668l-136.231-136.231c-20.431-20.431-53.239-20.431-73.668 0s-20.431 53.435 0 73.859l46.967 46.967h-208.92v-268.557c0-28.885-23.142-52.229-52.046-52.229s-52.229 23.35-52.229 52.229v320.792c0 28.885 23.35 52.046 52.229 52.046h261.155l-47.17 47.17c-20.431 20.431-20.431 53.239 0 73.668 10.216 10.216 23.504 15.395 36.834 15.395z"/></svg><span class="aa-title" id="title">Select source</span>&nbsp;▾</summary>
    <div class="aa-dropdown" id="sources">
      <ul><li><button class="aa-item" id="open">Open file</button><input id="file" type="file" accept="audio/*" hidden></li><li><button class="aa-item" data-id="mic">Microphone</button></li></ul>
    </div>
  </details>
  <button class="aa-play" id="play" aria-label="Play"><svg class="aa-icon" viewBox="0 0 819 1024" aria-hidden="true"><path id="play-icon" d="M213.308 291.971c0-29.549 23.948-53.504 53.497-53.504 9.185 0 14.999 2.398 25.225 6.47l375.259 218.333c17.454 10.348 25.533 26.969 28.647 46.117v5.376c-3.122 19.144-11.203 35.769-28.647 46.117l-375.251 218.325c-10.245 4.080-16.055 6.462-25.225 6.462-29.549 0-53.497-23.955-53.497-53.504v-440.211z"/></svg></button>
  <a class="aa-credit" id="credit" target="_blank" rel="noopener"></a>
</div>
<form class="settings-panel" id="panel" autocomplete="off" onsubmit="return false">
  <h2><a href="https://github.com/dy/gl-spectrum">gl-spectrum</a></h2>
  <label class="field"><span>type</span><span class="select"><select id="type"><option>line</option><option selected>fill</option></select></span></label>
  <span class="field"><span>palette</span><button type="button" class="swatch" id="swatch" title="Randomize palette" aria-label="Randomize palette"></button></span>
  <label class="field"><span>log</span><input type="checkbox" id="log" checked></label>
  <label class="field"><span>grid</span><input type="checkbox" id="grid-on" checked></label>
  <label class="field" title="Weighting"><span>weighting</span><span class="select"><select id="weighting"><option>a</option><option>b</option><option>c</option><option>d</option><option selected>itu</option><option>z</option></select></span></label>
  <label class="field"><span>trail</span><input type="checkbox" id="trail" checked></label>
</form>
<script type="module" src="./old.js"></script>
</body>
</html>
